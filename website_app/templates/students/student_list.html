{% load static %}
<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{% static 'website_app/css/student.css' %}">
</head>
<body>
    <div class="container">
        <h1>Student Directory</h1>
        
        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Course</th>
                        <th>Motto</th>
                    </tr>
                </thead>
                <tbody>
                    {% for student in students %}
                    <tr>
                        <td><strong>{{ student.name }}</strong></td>
                        <td><span class="course-badge">{{ student.course }}</span></td>
                        <td class="motto-text">{{ student.motto }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
