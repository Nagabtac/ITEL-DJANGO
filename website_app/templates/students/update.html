{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Student</title>
    <link rel="stylesheet" href="{% static 'css/update.css' %}">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h2>Edit Student Profile</h2>
                <p>Modify the details for <strong>{{ student.name }}</strong></p>
            </div>

            <form action="updateInfo" method="post">
                {% csrf_token %}
                <input type="hidden" name="id" value="{{student.id}}">

                <div class="form-group">
                    <label for="newName">Full Name</label>
                    <input type="text" name="newName" id="newName" value="{{student.name}}">
                </div>

                <div class="form-group">
                    <label for="newCourse">Course</label>
                    <input type="text" name="newCourse" id="newCourse" value="{{student.course}}">
                </div>

                <div class="form-group">
                    <label for="newMotto">Motto</label>
                    <input type="text" name="newMotto" id="newMotto" value="{{student.motto}}">
                </div>

                <div class="actions">
                    <button type="submit" class="btn-update">Save Changes</button>
                    <a href="/" class="btn-cancel">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
